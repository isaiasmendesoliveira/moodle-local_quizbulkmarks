name: Rebuild Moodle AMD assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: plugin
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle and plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_502_STABLE

      - name: Rebuild AMD files
        shell: bash
        run: |
          set +e
          moodle-plugin-ci grunt --max-lint-warnings 0
          gruntstatus=$?
          set -e

          cd plugin
          if git diff --quiet -- amd/build && git diff --cached --quiet -- amd/build; then
            if [ "$gruntstatus" -ne 0 ]; then
              echo "Grunt failed and no AMD build changes were generated."
              exit "$gruntstatus"
            fi
            echo "AMD build files are already current."
            exit 0
          fi

          echo "Canonical AMD files were generated by Moodle Grunt."
          git status --short amd/build

      - name: Commit generated AMD files
        working-directory: plugin
        shell: bash
        run: |
          git add amd/build
          if git diff --cached --quiet; then
            echo "No generated AMD changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild Moodle AMD assets"
          git push
